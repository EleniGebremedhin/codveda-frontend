<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow | Task Management</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="container">
      <!-- App Header -->
      <header class="app-header">
        <div>
          <h1>TaskFlow</h1>
          <p>Organize your tasks and stay productive.</p>
        </div>

        <button
          type="button"
          id="theme-toggle"
          aria-label="Toggle dark mode"
          aria-pressed="false"
        >
          🌙 Dark Mode
        </button>
      </header>

      <!-- Add Task Form -->
      <section class="task-section">
        <h2>Add a New Task</h2>

        <form id="task-form">
          <input
            type="text"
            id="task-input"
            placeholder="What needs to be done?"
            aria-label="Task title"
            required
          />

          <button type="submit" id="add-task-btn">+ Add Task</button>
        </form>
      </section>

      <!-- Task Search -->
      <section class="task-controls">
        <input
          type="search"
          id="search-input"
          placeholder="Search your tasks..."
          aria-label="Search tasks"
        />

        <!-- Task Filters -->
        <div class="filters">
          <button type="button" data-filter="all" class="active">All</button>

          <button type="button" data-filter="pending">Pending</button>

          <button type="button" data-filter="completed">Completed</button>
        </div>
      </section>

      <!-- Task Statistics -->
      <section class="statistics">
        <div class="stat-card">
          <h3>Total Tasks</h3>
          <p id="total-count">0</p>
        </div>

        <div class="stat-card">
          <h3>Completed</h3>
          <p id="completed-count">0</p>
        </div>

        <div class="stat-card">
          <h3>Pending</h3>
          <p id="pending-count">0</p>
        </div>
      </section>

      <!-- Task List -->
      <section class="tasks-container">
        <h2>Your Tasks</h2>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task!</p>
      </section>

      <!-- API Status -->
      <p id="api-status" role="status" aria-live="polite">
        Connecting to server...
      </p>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
